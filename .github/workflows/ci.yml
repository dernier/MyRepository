name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test della libreria core
        run: dotnet test tests/AppPhotoImmibili.Core.Tests --configuration Release
      - name: Controllo di compilazione dell'app (codice condiviso e XAML)
        run: dotnet build src/AppPhotoImmibili.App -p:TypeCheck=true --configuration Release

  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - name: Installa workload MAUI Android
        run: dotnet workload install maui-android
      - name: Compila APK
        run: dotnet publish src/AppPhotoImmibili.App -f net10.0-android -c Release -p:AndroidPackageFormat=apk
      - uses: actions/upload-artifact@v4
        with:
          name: appphotoimmibili-android
          path: src/AppPhotoImmibili.App/bin/Release/net10.0-android/publish/*-Signed.apk

  ios:
    # Compilazione per il simulatore: verifica il codice iOS senza certificati di firma.
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Installa workload MAUI iOS
        run: dotnet workload install maui-ios
      - name: Compila per il simulatore iOS
        run: dotnet build src/AppPhotoImmibili.App -c Debug -p:TargetFrameworks=net10.0-ios
